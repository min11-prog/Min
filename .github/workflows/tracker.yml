name: 경쟁사 UI 트래커

on:
  schedule:
    - cron: "0 9 * * *"  # 매일 오전 9시 (UTC 기준)
  workflow_dispatch:          # 수동 실행 버튼도 제공

jobs:
  track:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps

      # 이전 스냅샷을 캐시에서 복원 (변경 비교용)
      - name: 스냅샷 캐시 복원
        uses: actions/cache@v4
        with:
          path: snapshots/
          key: snapshots-${{ runner.os }}
          restore-keys: snapshots-

      - name: 트래커 실행
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DB_ID: ${{ secrets.NOTION_DB_ID }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
        run: python tracker.py

      # 업데이트된 스냅샷 캐시 저장
      - name: 스냅샷 캐시 저장
        uses: actions/cache@v4
        with:
          path: snapshots/
          key: snapshots-${{ runner.os }}-${{ github.run_id }}
